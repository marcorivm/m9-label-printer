[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m9printer"
dynamic = ["version"]
description = "Print 4x6 shipping labels to the Milestone M9 A4 thermal printer over Bluetooth"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pillow>=10", "pypdfium2>=4"]

[project.scripts]
m9printer = "m9printer.cli:main"

[project.gui-scripts]
m9printer-gui = "m9printer.gui:main"

[tool.setuptools]
packages = ["m9printer", "m9printer.transport"]

[tool.setuptools.dynamic]
version = { attr = "m9printer.__version__" }

[tool.setuptools.package-data]
m9printer = ["bin/*"]
